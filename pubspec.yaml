name: karatcore_erp
description: "KaratCore ERP - Enterprise Jewellery Business Management System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Animations & UI
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # Utilities & Modeling
  intl: ^0.19.0
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/fonts/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
